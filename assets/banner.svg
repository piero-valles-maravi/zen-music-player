<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Zen Music Player">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E1065"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#3B3B52"/>
      <stop offset="1" stop-color="#0B0B14"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <style>
      .t   { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#ffffff; }
      .sub { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#C7D2FE; }
      .lbl { font-family:'Segoe UI',Ubuntu,system-ui,sans-serif; fill:#E0F2FE; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="340" rx="28" fill="url(#bg)"/>

  <!-- COVER FLOW: three tilted album tiles -->
  <g transform="translate(132,170)">
    <g transform="translate(-40,0) skewY(11) scale(0.82)" opacity="0.4">
      <rect x="-56" y="-56" width="112" height="112" rx="14" fill="#ffffff" fill-opacity="0.16"/>
    </g>
    <g transform="translate(64,0) skewY(-11) scale(0.82)" opacity="0.4">
      <rect x="-56" y="-56" width="112" height="112" rx="14" fill="#ffffff" fill-opacity="0.16"/>
    </g>
    <g transform="translate(12,0)">
      <rect x="-68" y="-68" width="136" height="136" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
      <!-- vinyl peeking out of the sleeve -->
      <circle cx="30" cy="0" r="58" fill="url(#vinyl)"/>
      <circle cx="30" cy="0" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="30" cy="0" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle cx="30" cy="0" r="18" fill="url(#label)"/>
      <circle cx="30" cy="0" r="4"  fill="#0B0B14"/>
    </g>
    <text class="lbl" x="6" y="108" font-size="14" text-anchor="middle" opacity="0.8">Cover Flow</text>
  </g>

  <!-- TITLE -->
  <text class="t"   x="330" y="128" font-size="62" font-weight="700" letter-spacing="-1">Zen Music Player</text>
  <text class="sub" x="332" y="168" font-size="21">Tu biblioteca local y el catálogo de internet, en un solo reproductor.</text>
  <text class="sub" x="332" y="197" font-size="21" opacity="0.72">Your local library and the whole internet catalog, in one player.</text>

  <!-- FEATURE CHIPS -->
  <g transform="translate(332,224)">
    <g>
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
      <text class="lbl" x="75" y="22" font-size="14" text-anchor="middle">Biblioteca local</text>
    </g>
    <g transform="translate(162,0)">
      <rect x="0" y="0" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
      <text class="lbl" x="63" y="22" font-size="14" text-anchor="middle">Explorar</text>
    </g>
    <g transform="translate(300,0)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
      <text class="lbl" x="59" y="22" font-size="14" text-anchor="middle">6 temas</text>
    </g>
    <g transform="translate(430,0)">
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
      <text class="lbl" x="80" y="22" font-size="14" text-anchor="middle">Favoritos · Estrellas</text>
    </g>
  </g>

  <!-- WAVEFORM -->
  <g transform="translate(332,286)" fill="#A5B4FC" fill-opacity="0.75">
    <rect x="0"   y="-6"  width="4" height="12" rx="2"/>
    <rect x="12"  y="-14" width="4" height="28" rx="2"/>
    <rect x="24"  y="-22" width="4" height="44" rx="2"/>
    <rect x="36"  y="-10" width="4" height="20" rx="2"/>
    <rect x="48"  y="-18" width="4" height="36" rx="2"/>
    <rect x="60"  y="-26" width="4" height="52" rx="2"/>
    <rect x="72"  y="-12" width="4" height="24" rx="2"/>
    <rect x="84"  y="-20" width="4" height="40" rx="2"/>
    <rect x="96"  y="-8"  width="4" height="16" rx="2"/>
    <rect x="108" y="-16" width="4" height="32" rx="2"/>
    <rect x="120" y="-24" width="4" height="48" rx="2"/>
    <rect x="132" y="-10" width="4" height="20" rx="2"/>
    <rect x="144" y="-18" width="4" height="36" rx="2"/>
    <rect x="156" y="-6"  width="4" height="12" rx="2"/>
    <rect x="168" y="-14" width="4" height="28" rx="2"/>
    <rect x="180" y="-22" width="4" height="44" rx="2"/>
    <rect x="192" y="-12" width="4" height="24" rx="2"/>
    <rect x="204" y="-8"  width="4" height="16" rx="2"/>
  </g>

  <!-- PLAYER CARD (right) -->
  <g transform="translate(940,68)">
    <rect x="0" y="0" width="190" height="204" rx="20" fill="#0B0B14" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="22" y="20" width="146" height="90" rx="12" fill="url(#label)" fill-opacity="0.55"/>
    <rect x="22" y="122" width="104" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="22" y="138" width="68"  height="7" rx="3.5" fill="#ffffff" fill-opacity="0.14"/>
    <rect x="22" y="160" width="146" height="4" rx="2" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="22" y="160" width="86"  height="4" rx="2" fill="#A5B4FC"/>
    <circle cx="108" cy="162" r="5" fill="#ffffff"/>
    <g fill="#ffffff" fill-opacity="0.8" transform="translate(0,182)">
      <path d="M56 -6 h3 v12 h-3 z M60 0 l11 6 v-12 z"/>
      <circle cx="95" cy="0" r="12" fill="#ffffff" fill-opacity="0.92"/>
      <path d="M91 -6 l10 6 -10 6 z" fill="#1E1B4B" fill-opacity="1"/>
      <path d="M120 -6 l11 6 -11 6 z M133 -6 h3 v12 h-3 z"/>
    </g>
  </g>
</svg>
