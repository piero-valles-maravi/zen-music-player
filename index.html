<!doctype html>
<html lang="es" data-theme="white">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zen Music Player</title>
  </head>
  <!--
    Zen Music Player — full UI markup. Every screen the app has is in this file;
    the renderer never creates top-level structure, only fills #track-list,
    #detail-panel and #queue-list. Order below: top bar (tabs + settings),
    main (library grid + detail panel, resize handle, player card), mini-bar.
    Docs: docs/ARCHITECTURE.md
  -->
  <body>
    <div id="app">

      <!-- TOP BAR -->
      <div id="topbar">
        <div id="library-tabs">
          <button class="tab active" data-tab="artists">Artistas</button>
          <button class="tab" data-tab="albums">Álbumes</button>
          <button class="tab" data-tab="songs">Canciones</button>
          <button class="tab" data-tab="favorites">Favoritos</button>
          <button class="tab" data-tab="search">Explorar</button>
        </div>
        <div id="topbar-controls">

          <!-- Cover Flow toggle (only useful in Albums/Artists tab) -->
          <button id="cf-toggle-btn" title="Vista Cover Flow" class="topbar-icon-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6.5C4 5.12 5.12 4 6.5 4S9 5.12 9 6.5 7.88 9 6.5 9 4 7.88 4 6.5zM4 17.5C4 16.12 5.12 15 6.5 15S9 16.12 9 17.5 7.88 20 6.5 20 4 18.88 4 17.5zM15 6.5C15 5.12 16.12 4 17.5 4S20 5.12 20 6.5 18.88 9 17.5 9 15 7.88 15 6.5zM15 17.5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5-2.5-1.12-2.5-2.5zM9.5 12c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5S9.5 13.38 9.5 12z"/></svg>
          </button>

          <!-- Settings gear -->
          <div id="settings-wrap">
            <button id="settings-btn" class="topbar-icon-btn" title="Configuración">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
            <div id="settings-panel">
              <div class="settings-section">
                <div class="settings-label">Tamaño de cuadrícula</div>
                <div class="settings-row">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M3 3h7v7H3zm0 11h7v7H3zm11-11h7v7h-7zm0 11h7v7h-7z"/></svg>
                  <input type="range" id="grid-size-slider" min="120" max="320" value="170" />
                </div>
              </div>
              <div class="settings-section">
                <div class="settings-label">Panel de detalle</div>
                <div id="detail-pos-modes" class="settings-row">
                  <button class="dp-btn active" data-pos="bottom" title="Panel inferior">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 8H5V5h14v6zm0 8H5v-6h14v6z"/></svg>
                  </button>
                  <button class="dp-btn" data-pos="inline" title="Expandir en cuadrícula">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3H4v10h16V3zm0 12H4v2h16v-2zm-8 4H4v2h8v-2z"/></svg>
                  </button>
                </div>
              </div>
              <div class="settings-section">
                <div class="settings-label">Tema</div>
                <div id="theme-picker" class="settings-row">
                  <button class="theme-dot active" data-theme="white"   title="Blanco"   style="background:#fff;border:2px solid #ccc"></button>
                  <button class="theme-dot"        data-theme="midnight" title="Midnight"  style="background:#141420"></button>
                  <button class="theme-dot"        data-theme="sand"     title="Arena"     style="background:#d4a96a"></button>
                  <button class="theme-dot"        data-theme="sage"     title="Salvia"    style="background:#5a9e5a"></button>
                  <button class="theme-dot"        data-theme="lavender" title="Lavanda"   style="background:#8b5fd4"></button>
                  <button class="theme-dot"        data-theme="slate"    title="Pizarra"   style="background:#4a6ea8"></button>
                </div>
              </div>
              <div class="settings-section">
                <div class="settings-label">Calidad de streaming</div>
                <div id="stream-quality-control" class="settings-row">
                  <button class="sq-btn active" data-quality="high">Alta</button>
                  <button class="sq-btn" data-quality="medium">Media</button>
                  <button class="sq-btn" data-quality="low">Baja</button>
                </div>
              </div>
            </div>
          </div>

          <button id="btn-open-folder">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
            Abrir carpeta
          </button>
        </div>
      </div>

      <!-- MAIN -->
      <div id="main">

        <!-- LIBRARY -->
        <div id="library">
          <div id="track-list"></div>

          <!-- Bottom / Right detail panel -->
          <div id="detail-panel">
            <div id="detail-header">
              <button id="detail-close" title="Cerrar">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
              </button>
              <span id="detail-title"></span>

              <!-- Thumb size -->
              <div id="detail-thumb-control" title="Tamaño de miniaturas">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                <input type="range" id="detail-thumb-slider" min="24" max="64" value="34" />
              </div>

              <!-- View mode buttons (stay in detail header) -->
              <div id="detail-view-modes">
                <button class="dm-btn active" data-view="list"    title="Lista">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <button class="dm-btn" data-view="columns" title="Columnas">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5v14h8V5H3zm6 12H5v-2h4v2zm0-4H5v-2h4v2zm0-4H5V7h4v2zm6-4v14h8V5h-8zm6 12h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2z"/></svg>
                </button>
                <button class="dm-btn" data-view="table"   title="Tabla">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 2v3H5V5h15zm-9 14H5v-9h6v9zm9 0h-7v-9h7v9z"/></svg>
                </button>
                <button class="dm-btn" data-view="compact" title="Compacta">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                </button>
              </div>

              <button id="detail-play-all">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Reproducir todo
              </button>
            </div>
            <div id="detail-body">
              <div id="detail-albums"></div>
              <div id="detail-songs"></div>
            </div>
          </div>
        </div>

        <!-- RESIZE HANDLE -->
        <div id="resize-handle"></div>

        <!-- PLAYER PANEL -->
        <div id="player">
          <button id="player-collapse-btn" title="Minimizar">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <div id="player-full">
            <div id="cover-wrap">
              <div id="cover-art">
                <svg id="cover-icon" viewBox="0 0 80 80" fill="none">
                  <circle cx="40" cy="40" r="16" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
                  <circle cx="40" cy="40" r="5" fill="rgba(255,255,255,0.6)"/>
                  <path d="M52 20 L52 38 L44 36 L44 18 Z" fill="rgba(255,255,255,0.5)"/>
                </svg>
              </div>
            </div>
            <div id="track-info">
              <div id="track-title">Sin reproducción</div>
              <div id="track-artist">—</div>
              <div id="track-album">—</div>
            </div>
            <div id="progress-section">
              <div id="time-current">0:00</div>
              <div id="progress-bar-wrap">
                <div id="progress-bar">
                  <div id="progress-fill"></div>
                  <div id="progress-thumb"></div>
                </div>
              </div>
              <div id="time-total">0:00</div>
            </div>
            <div id="controls">
              <button class="ctrl-btn" id="btn-prev">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
              </button>
              <button class="ctrl-btn primary" id="btn-play">
                <svg id="icon-play"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>
              <button class="ctrl-btn" id="btn-next">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
            </div>
            <div id="volume-section">
              <svg id="vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              <input type="range" id="volume-slider" min="0" max="100" value="80" />
            </div>
            <div id="queue-section">
              <div id="queue-header">
                <span id="queue-label">REPRODUCIENDO</span>
                <span id="queue-pos">—</span>
              </div>
              <div id="queue-list"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- HORIZONTAL MINI-BAR -->
      <div id="mini-bar">
        <div id="mb-art"></div>
        <div id="mb-info">
          <div id="mb-title">Sin reproducción</div>
          <div id="mb-artist">—</div>
        </div>
        <div id="mb-controls">
          <button class="mb-btn" id="mb-prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
          <button class="mb-btn primary" id="mb-play">
            <svg id="mb-icon-play"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="mb-icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="mb-btn" id="mb-next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        </div>
        <div id="mb-progress-wrap">
          <div id="mb-time-cur">0:00</div>
          <div id="mb-prog-bar"><div id="mb-prog-fill"></div></div>
          <div id="mb-time-tot">0:00</div>
        </div>
        <div id="mb-extras">
          <svg id="mb-vol-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <input type="range" id="mb-volume" min="0" max="100" value="80" />
          <div id="mb-stars" data-mb-stars></div>
          <button id="mb-fav" class="mb-fav-btn">♥</button>
        </div>
        <button id="mb-expand" title="Expandir reproductor">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
      </div>

    </div>
    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
